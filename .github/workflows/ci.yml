name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libsqlite3-dev
      - run: sh scripts/run_tests.sh

  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake openssl@3
      - name: gate
        env:
          OPENSSL_ROOT_DIR: ${{ vars.OPENSSL_ROOT_DIR || '' }}
        run: |
          if [ -z "$OPENSSL_ROOT_DIR" ]; then export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"; fi
          sh scripts/run_tests.sh

  patches-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y git
      - name: patch-set applies cleanly against the pinned Ladybird
        run: sh tests/test_patches.sh

  # Full Ladybird build with the patch-set applied: expensive, not a merge gate.
  full-ladybird-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja openssl@3 qt
      - run: sh scripts/sync_ladybird.sh
      - name: apply patch-set
        run: |
          for p in patches/ladybird/*.patch; do
            [ -e "$p" ] || break
            git -C ../ladybird-pinned am --abort 2>/dev/null || true
            git -C ../ladybird-pinned apply --3way "$GITHUB_WORKSPACE/$p"
          done
      - name: build (verification job; owner-triggered)
        run: echo "placeholder: full build steps land with the patch-set tasks"
