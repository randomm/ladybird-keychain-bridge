name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev libsqlite3-dev clang-format
      - run: sh scripts/run_tests.sh

  core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake openssl@3 clang-format
      - name: gate
        env:
          OPENSSL_ROOT_DIR: ${{ vars.OPENSSL_ROOT_DIR || '' }}
        run: |
          if [ -z "$OPENSSL_ROOT_DIR" ]; then export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"; fi
          sh scripts/run_tests.sh

  patches-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y git
      - name: patch-set applies cleanly against the pinned Ladybird
        run: sh scripts/check_patches.sh

  # Full Ladybird build with the patch-set applied. Not gated on every push:
  # it runs for any PR touching patches/** (compile failures in the patch-set
  # are then hard failures — no continue-on-error) and on manual dispatch.
  full-ladybird-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: does this PR touch the patch-set?
        id: touched
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE}"...HEAD | grep -q '^patches/'; then
              echo hit=true >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name != 'pull_request' || steps.touched.outputs.hit == 'true'
        run: brew install cmake ninja openssl@3
      - if: github.event_name != 'pull_request' || steps.touched.outputs.hit == 'true'
        run: sh scripts/sync_ladybird.sh
      - name: apply patch-set
        if: github.event_name != 'pull_request' || steps.touched.outputs.hit == 'true'
        run: |
          for p in patches/ladybird/*.patch; do
            [ -e "$p" ] || break
            git -C ../ladybird-pinned am --abort 2>/dev/null || true
            git -C ../ladybird-pinned apply --3way "$GITHUB_WORKSPACE/$p"
          done
      - name: build TestLibWeb from the patched tree (preset-driven)
        if: github.event_name != 'pull_request' || steps.touched.outputs.hit == 'true'
        run: cmake --preset Release && cmake --build --preset Release --target TestLibWeb
        working-directory: ../ladybird-pinned
      - name: run the credential-detection suite
        if: github.event_name != 'pull_request' || steps.touched.outputs.hit == 'true'
        run: ctest --preset Release -R TestLibWeb --output-on-failure
        working-directory: ../ladybird-pinned
